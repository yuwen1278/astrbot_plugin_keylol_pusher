name: astrbot_plugin_keylol_pusher
display_name: 其乐论坛推送
short_desc: 订阅其乐论坛版块，新帖自动推送到 QQ 群或私聊
desc: |-
  把其乐论坛（keylol.com）的新帖自动推送到 QQ 群 / QQ 私聊。

  · 通过论坛官方 RSS 增量发现新帖，无需登录
  · 自动抓取帖子首楼正文、配图（可关闭），并清理 Steam 小部件、广告等噪声
  · 支持按版块订阅，可附加关键字过滤（如只推含「DLC」的帖子）
  · 群聊与私聊均可独立订阅，互不影响
  · 已推送帖子持久化去重，重启不会重复推送
  · 首次运行默认只记录历史帖、不刷屏，可通过配置关闭

  指令：/其乐添加 <fid或版块名> [关键字]、/其乐删除 <fid>、/其乐列表、
  /其乐测试、/其乐状态、/其乐版块、/其乐帮助
version: 1.0.0
author: yuwen1278
repo: https://github.com/yuwen1278/astrbot_plugin_keylol_pusher
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
astrbot_version: ">=4.9.2,<5"
tags:
  - 论坛
  - 推送
  - keylol
  - 其乐
  - 订阅
